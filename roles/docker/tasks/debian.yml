- name: Install requirements
  apt:
    name: 
      - apt-transport-https
      - ca-certificates
      - gnupg-agent
    state: latest

- name: Add Docker's repository (deb822 format)
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
    suites: '{{ ansible_facts.distribution_release }}'
    components: stable
    signed_by: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg
    state: present
    when: ansible_facts.distribution|lower != 'debian' 
          or (ansible_facts.distribution_major_version|int > 12)

- name: Install Docker engine community
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      # - docker-compose-plugin
      # Docker Compose v2 is installed as a plugin by default for recent debian-like distribs
      # (validated for debian 12 & 13, and ubuntu 22.04 & 24.04)
    state: latest
    update_cache: true
